# Deploys to Fly.io when something merges to master. Setup is in docs/fly.md ("Deploy automatically").
# Needs the repository secret FLY_API_TOKEN. The app name comes from fly.toml.
name: Deploy to Fly

on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "test/**"
  workflow_dispatch:

# One deploy at a time; a newer merge waits for the running one instead of cancelling it mid-deploy.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      # Pasted tokens often pick up a trailing newline or spaces, which Fly rejects as "token validation error".
      - name: Check the Fly token
        env:
          RAW_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$token" ]; then echo "::error::The FLY_API_TOKEN secret is empty or missing (docs/fly.md, Deploy automatically)"; exit 1; fi
          echo "::add-mask::$token"
          echo "FLY_API_TOKEN=$token" >> "$GITHUB_ENV"
          FLY_API_TOKEN="$token" flyctl status >/dev/null || { echo "::error::Fly rejected the token. Create a new one and paste the whole output (docs/fly.md, Deploy automatically, Troubleshooting)"; exit 1; }
      # --ha=false: the volume can only be used by one Machine
      - run: flyctl deploy --remote-only --ha=false
