model_list:
  # Tier 1: Local CLI Wrapper (Zero API Cost)
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: openai/claude-3-5-sonnet-20240620
      api_base: http://localhost:8000/v1
      api_key: dummy-key-not-needed

  # Tier 2: Groq Llama 3 (Free Tier)
  - model_name: fallback-groq
    litellm_params:
      model: groq/llama3-70b-8192
      api_key: os.environ/GROQ_API_KEY

  # Tier 3: Gemini Flash (Free Tier)
  - model_name: fallback-gemini
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Tier 4: OpenRouter Auto-Free (Free Tier)
  - model_name: fallback-openrouter
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

# LiteLLM Fallback Chain
litellm_settings:
  fallbacks: [{"claude-3-5-sonnet": ["fallback-groq", "fallback-gemini", "fallback-openrouter"]}]