# The whole harness on one server: docker compose up -d --build
# Needs .env next to this file with your API keys, HARNESS_PASSWORD (or HARNESS_REQUIRE_LOGIN + HARNESS_ADMINS) and
# LITELLM_MASTER_KEY.
# Only the Interceptor (port 3000) is published; the Router and Gateway are
# reachable only from the other containers.
#
# Launch settings, all optional, go in .env too (see .env.example):
#   HARNESS_MODE        jev (what routellm-config.yaml ships with), laya,
#                       routellm, llm or passthrough
#   STRONG_MODEL, WEAK_MODEL, ...   the models the Router picks between
#   COMPOSE_PROFILES=local and LOCAL_MODELS   run Ollama with these models
#   COMPOSE_PROFILES=tunnel (+ TUNNEL_TOKEN) or tunnel-quick   reach it from a phone over https
#   LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY   log every call to Langfuse (cloud, or COMPOSE_PROFILES=langfuse for your own)
# Change them, then run docker compose up -d --build.
x-local-urls: &local-urls
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  # the Tier 1 local engine on this machine (launch-local.sh, listening on 0.0.0.0)
  LOCAL_ENGINE_URL: ${LOCAL_ENGINE_URL:-http://host.docker.internal:8000}

services:
  harness:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # A server needs HARNESS_PASSWORD, or HARNESS_REQUIRE_LOGIN=1 with HARNESS_ADMINS (see the README); it refuses to start with neither
      HARNESS_SERVER: "1"
      HARNESS_PASSWORD: ${HARNESS_PASSWORD:-}
      HARNESS_REQUIRE_LOGIN: ${HARNESS_REQUIRE_LOGIN:-}
      HARNESS_ADMINS: ${HARNESS_ADMINS:-}
      HARNESS_USERS_FILE: /app/data/users.json
      ROUTER_URL: http://router:6060
      GATEWAY_URL: http://gateway:4000
      # The task runner (COMPOSE_PROFILES=runs), reached over the compose network
      RUNNER_URL: http://runner:3100
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      HARNESS_SETTINGS_FILE: /app/data/harness-settings.json
      HARNESS_PROFILES_FILE: /app/data/routing-profiles.json
      HARNESS_USAGE_FILE: /app/data/harness-usage.json
      MCP_CONFIG: /app/data/mcp-servers.json
      <<: *local-urls
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "${HARNESS_PORT:-3000}:3000"
    volumes:
      - ./config.yaml:/app/config.yaml   # the routing page edits it
      - ./data:/app/data                 # settings, usage, mcp-servers.json
      - ./repos:/repos                   # clone repos here to link them in chat (/repos/name)
    depends_on: [router, gateway]

  router:
    build:
      context: .
      dockerfile: docker/router.Dockerfile
      args:
        # laya and routellm modes need their classifier built in
        ROUTER_BACKENDS: ${ROUTER_BACKENDS:-${HARNESS_MODE:-}}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./routellm-config.yaml:/app/routellm-config.yaml   # Router settings save here

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # LiteLLM won't start without one; the harness sends the same key
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env (any string starting with sk-)}
      <<: *local-urls
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro

  # The task runner (the Runs page), only with COMPOSE_PROFILES=runs in .env.
  # Each run's commands go to an E2B cloud sandbox (RUNNER_SANDBOX=e2b,
  # E2B_API_KEY), so the agent works in a Linux VM rather than in this
  # container; the runner here only packs the branch in and back out. Runs and
  # branches land in ./runs and ./repos, as on your PC, so the Runs page's diff,
  # Continue and Retry work the same. (RUNNER_SANDBOX=local also works here —
  # the worktree is made from the copy of the repo in ./repos — but commands
  # then run in this image, which has only Node and git.)
  # Set RUNNER_TOKEN in .env (any long random text): the Interceptor sends it,
  # and nothing else on the network can drive the runner without it.
  runner:
    build:
      context: .
      dockerfile: docker/runner.Dockerfile
    profiles: [runs]
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_HOST: 0.0.0.0
      RUNNER_PORT: "3100"
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env (any long random text)}
      # Runner host check: it only answers a Host it was told about
      RUNNER_ALLOWED_HOSTS: runner:3100,harness:3100
      RUNNER_ROOTS: /repos
      RUNNER_DIR: /app/runs
      RUNNER_SANDBOX: ${RUNNER_SANDBOX:-e2b}
      HARNESS_URL: http://harness:3000
      HARNESS_PASSWORD: ${HARNESS_PASSWORD:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      E2B_TEMPLATE: ${E2B_TEMPLATE:-base}
    volumes:
      - ./runs:/app/runs       # run records and each run's worktree
      - ./repos:/repos         # the repos a run may start in (RUNNER_ROOTS)
    depends_on: [harness]

  # Local models with Ollama, only with COMPOSE_PROFILES=local in .env.
  # Downloads LOCAL_MODELS on start; the Gateway lists each as local-<name>.
  ollama:
    image: ollama/ollama
    profiles: [local]
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/ollama-start.sh"]
    volumes:
      - ./docker/ollama-start.sh:/ollama-start.sh:ro
      - ollama:/root/.ollama
    # NVIDIA GPU: install the NVIDIA Container Toolkit and uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  # A Cloudflare tunnel, only with COMPOSE_PROFILES=tunnel (a stable address,
  # needs TUNNEL_TOKEN in .env) or COMPOSE_PROFILES=tunnel-quick (a random
  # address that changes each start, no Cloudflare account; the address is in
  # `docker compose logs tunnel-quick`). The tunnel dials out to Cloudflare, so
  # no port needs opening. The harness still asks for HARNESS_PASSWORD.
  # Combine with others: COMPOSE_PROFILES=local,tunnel
  tunnel:
    image: cloudflare/cloudflared:2026.10.2
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (see "Reach it from your phone" in the README)}
    depends_on: [harness]

  tunnel-quick:
    image: cloudflare/cloudflared:2026.10.2
    profiles: [tunnel-quick]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://harness:3000
    depends_on: [harness]

  # Your own Langfuse (LLM logging), only with COMPOSE_PROFILES=langfuse. Needs
  # about 3 GB of RAM, so not for a 1 GB server: use cloud.langfuse.com there.
  # Open http://localhost:3001 (LANGFUSE_PORT). Set LANGFUSE_INIT_* in .env and the
  # login and the API keys are created on the first start (README: "Langfuse").
  # The harness reaches it as http://langfuse-web:3000 (LANGFUSE_HOST).
  langfuse-web:
    image: langfuse/langfuse:3
    profiles: [langfuse]
    restart: unless-stopped
    depends_on: [langfuse-db, langfuse-clickhouse, langfuse-redis, langfuse-minio]
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment: &langfuse-env
      DATABASE_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/postgres
      SALT: "${LANGFUSE_SALT:?set LANGFUSE_SALT in .env (any long random text)}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env (64 hex characters, from openssl rand -hex 32)}"
      NEXTAUTH_SECRET: ${LANGFUSE_SALT}
      NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3001}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: langfuse-redis
      REDIS_AUTH: ${LANGFUSE_DB_PASSWORD:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_DB_PASSWORD:-langfuse}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      # optional first-start setup: an organisation, project, API keys and a login
      LANGFUSE_INIT_ORG_ID: harness
      LANGFUSE_INIT_ORG_NAME: Harness
      LANGFUSE_INIT_PROJECT_ID: harness
      LANGFUSE_INIT_PROJECT_NAME: Harness
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    profiles: [langfuse]
    restart: unless-stopped
    depends_on: [langfuse-db, langfuse-clickhouse, langfuse-redis, langfuse-minio]
    environment: *langfuse-env

  langfuse-db:
    image: postgres:17
    profiles: [langfuse]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
    volumes:
      - langfuse-db:/var/lib/postgresql/data

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    profiles: [langfuse]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
    volumes:
      - langfuse-clickhouse:/var/lib/clickhouse

  langfuse-redis:
    image: redis:7
    profiles: [langfuse]
    restart: unless-stopped
    command: --requirepass ${LANGFUSE_DB_PASSWORD:-langfuse} --maxmemory-policy noeviction

  langfuse-minio:
    image: minio/minio
    profiles: [langfuse]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
    volumes:
      - langfuse-minio:/data

volumes:
  ollama:
  langfuse-db:
  langfuse-clickhouse:
  langfuse-minio:
