<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Sign-in, billing and storage</title><desc id="d">Who may sign in, whose OpenRouter credential pays, and which Postgres tables hold what.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8793a3"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8793a3"/></marker></defs><rect x="20" y="30" width="320" height="560" rx="14" fill="none" stroke="#8793a3" stroke-width="1.5" stroke-dasharray="8 5"/><rect x="28.5" y="20" width="79.0" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="68.0" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2430">1  Sign in</text><rect x="40" y="70" width="280" height="60" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="180.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Browser</text><text x="180.0" y="112" text-anchor="middle" font-size="11.5" fill="#1b2430">GET /auth/google or /auth/github</text><rect x="40" y="160" width="280" height="60" rx="9" fill="#c8ecec" stroke="#2f9aa0" stroke-width="1.6"/><text x="180.0" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Neon Auth (Better Auth)</text><text x="180.0" y="202" text-anchor="middle" font-size="11.5" fill="#1b2430">provider hand-off (utils/oauth.js)</text><rect x="40" y="250" width="280" height="76" rx="9" fill="#e1d6f8" stroke="#7a5cc4" stroke-width="1.6"/><text x="180.0" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Invite check</text><text x="180.0" y="292" text-anchor="middle" font-size="11.5" fill="#1b2430">harness_store: invites, roles</text><text x="180.0" y="308" text-anchor="middle" font-size="11.5" fill="#1b2430">HARNESS_ADMIN_EMAILS = admins</text><rect x="40" y="356" width="280" height="60" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="180.0" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Session cookie</text><text x="180.0" y="398" text-anchor="middle" font-size="11.5" fill="#1b2430">sessions table keeps a hash only</text><rect x="40" y="446" width="280" height="110" rx="9" fill="#fbe3b0" stroke="#c58a14" stroke-width="1.6"/><text x="180.0" y="468" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Roles</text><text x="180.0" y="488" text-anchor="middle" font-size="11.5" fill="#1b2430">admin: owner key, all controls</text><text x="180.0" y="504" text-anchor="middle" font-size="11.5" fill="#1b2430">user: own credential, own data</text><text x="180.0" y="520" text-anchor="middle" font-size="11.5" fill="#1b2430">guest: owner key, capped dollars</text><text x="180.0" y="536" text-anchor="middle" font-size="11.5" fill="#1b2430">break-glass: HARNESS_ADMINS password</text><path d="M180 130 L180 160" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><path d="M180 220 L180 250" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><path d="M180 326 L180 356" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><path d="M180 416 L180 446" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="380" y="30" width="300" height="560" rx="14" fill="none" stroke="#8793a3" stroke-width="1.5" stroke-dasharray="8 5"/><rect x="388.75" y="20" width="85.3" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="431.4" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2430">2  Who pays</text><rect x="400" y="70" width="260" height="70" rx="9" fill="#cfe3ff" stroke="#4a86d8" stroke-width="1.6"/><text x="530.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Admin</text><text x="530.0" y="112" text-anchor="middle" font-size="11.5" fill="#1b2430">owner key OPENROUTER_API_KEY</text><text x="530.0" y="128" text-anchor="middle" font-size="11.5" fill="#1b2430">(main key can self-renew)</text><rect x="400" y="170" width="260" height="100" rx="9" fill="#f9d2d6" stroke="#c9505e" stroke-width="1.6"/><text x="530.0" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Guest</text><text x="530.0" y="212" text-anchor="middle" font-size="11.5" fill="#1b2430">credit_accounts + credit_holds</text><text x="530.0" y="228" text-anchor="middle" font-size="11.5" fill="#1b2430">reserve worst case, then settle</text><text x="530.0" y="244" text-anchor="middle" font-size="11.5" fill="#1b2430">refused when the cap is spent</text><rect x="400" y="300" width="260" height="130" rx="9" fill="#cdeed6" stroke="#3f9f5f" stroke-width="1.6"/><text x="530.0" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Full user</text><text x="530.0" y="342" text-anchor="middle" font-size="11.5" fill="#1b2430">user_credentials (encrypted)</text><text x="530.0" y="358" text-anchor="middle" font-size="11.5" fill="#1b2430">OAuth connect, pasted key, or</text><text x="530.0" y="374" text-anchor="middle" font-size="11.5" fill="#1b2430">a key the harness issues</text><text x="530.0" y="390" text-anchor="middle" font-size="11.5" fill="#1b2430">signed ticket -&gt; /openrouter-proxy</text><rect x="400" y="460" width="260" height="96" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6" stroke-dasharray="6 4"/><text x="530.0" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Optional federation (owner)</text><text x="530.0" y="502" text-anchor="middle" font-size="11.5" fill="#1b2430">utils/openrouterAuth.js trades</text><text x="530.0" y="518" text-anchor="middle" font-size="11.5" fill="#1b2430">a JWT from your own identity</text><text x="530.0" y="534" text-anchor="middle" font-size="11.5" fill="#1b2430">provider for 15 min tokens</text><rect x="720" y="30" width="300" height="560" rx="14" fill="none" stroke="#8793a3" stroke-width="1.5" stroke-dasharray="8 5"/><rect x="730.75" y="20" width="135.7" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="798.6" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2430">3  Where data lives</text><rect x="740" y="70" width="260" height="68" rx="9" fill="#c8ecec" stroke="#2f9aa0" stroke-width="1.6"/><text x="870.0" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">harness_store, sessions</text><text x="870.0" y="112" text-anchor="middle" font-size="11.5" fill="#1b2430">users, API keys, invites, logins</text><rect x="740" y="154" width="260" height="68" rx="9" fill="#c8ecec" stroke="#2f9aa0" stroke-width="1.6"/><text x="870.0" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">chats, chat_messages</text><text x="870.0" y="196" text-anchor="middle" font-size="11.5" fill="#1b2430">one row per message, versioned</text><rect x="740" y="238" width="260" height="68" rx="9" fill="#c8ecec" stroke="#2f9aa0" stroke-width="1.6"/><text x="870.0" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">user_data, user_mcp</text><text x="870.0" y="280" text-anchor="middle" font-size="11.5" fill="#1b2430">projects, schedules, routings; MCP</text><rect x="740" y="322" width="260" height="68" rx="9" fill="#c8ecec" stroke="#2f9aa0" stroke-width="1.6"/><text x="870.0" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">attachments</text><text x="870.0" y="364" text-anchor="middle" font-size="11.5" fill="#1b2430">files, 6 MB each, per-user quota</text><rect x="740" y="406" width="260" height="68" rx="9" fill="#c8ecec" stroke="#2f9aa0" stroke-width="1.6"/><text x="870.0" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">user_credentials, user_github</text><text x="870.0" y="448" text-anchor="middle" font-size="11.5" fill="#1b2430">encrypted with ENCRYPTION_KEY</text><rect x="740" y="490" width="260" height="68" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="870.0" y="512" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">files on the volume</text><text x="870.0" y="532" text-anchor="middle" font-size="11.5" fill="#1b2430">settings, routing-profiles, runs/</text></svg>
