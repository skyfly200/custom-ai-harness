<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Hosted deployment on Fly and Neon</title><desc id="d">A single Fly Machine runs four processes behind Fly proxy; Neon holds users and chats.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8793a3"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8793a3"/></marker></defs><rect x="20" y="60" width="190" height="76" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="115.0" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Browser / phone</text><text x="115.0" y="102" text-anchor="middle" font-size="11.5" fill="#1b2430">Bright Chat (installable)</text><text x="115.0" y="118" text-anchor="middle" font-size="11.5" fill="#1b2430">agents.skylerfly.com</text><rect x="20" y="170" width="190" height="76" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="115.0" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Claude Code, API clients</text><text x="115.0" y="212" text-anchor="middle" font-size="11.5" fill="#1b2430">ANTHROPIC_BASE_URL</text><text x="115.0" y="228" text-anchor="middle" font-size="11.5" fill="#1b2430">+ named API key</text><rect x="260" y="100" width="170" height="90" rx="9" fill="#fbe3b0" stroke="#c58a14" stroke-width="1.6"/><text x="345.0" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Fly proxy</text><text x="345.0" y="142" text-anchor="middle" font-size="11.5" fill="#1b2430">TLS, /healthz check</text><text x="345.0" y="158" text-anchor="middle" font-size="11.5" fill="#1b2430">wakes a stopped Machine</text><text x="345.0" y="174" text-anchor="middle" font-size="11.5" fill="#1b2430">on the next request</text><rect x="470" y="30" width="360" height="370" rx="14" fill="none" stroke="#8793a3" stroke-width="1.5" stroke-dasharray="8 5"/><rect x="485.50000000000006" y="20" width="255.4" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="613.2" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2430">Fly Machine (Dockerfile.fly, fly.toml)</text><rect x="490" y="60" width="320" height="50" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="650.0" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">docker/fly-start.js (supervisor)</text><text x="650.0" y="102" text-anchor="middle" font-size="11.5" fill="#1b2430">starts and watches the processes</text><rect x="490" y="130" width="320" height="64" rx="9" fill="#cfe3ff" stroke="#4a86d8" stroke-width="1.6"/><text x="650.0" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Interceptor :3000 (the only public port)</text><text x="650.0" y="172" text-anchor="middle" font-size="11.5" fill="#1b2430">server.js; idle stop after HARNESS_IDLE_STOP_MIN</text><rect x="490" y="214" width="150" height="64" rx="9" fill="#cdeed6" stroke="#3f9f5f" stroke-width="1.6"/><text x="565.0" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Gateway :4000</text><text x="565.0" y="256" text-anchor="middle" font-size="11.5" fill="#1b2430">LiteLLM, 127.0.0.1</text><rect x="660" y="214" width="150" height="64" rx="9" fill="#e1d6f8" stroke="#7a5cc4" stroke-width="1.6"/><text x="735.0" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Router :6060</text><text x="735.0" y="256" text-anchor="middle" font-size="11.5" fill="#1b2430">router.py, 127.0.0.1</text><rect x="490" y="298" width="150" height="64" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="565.0" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Volume /app/data</text><text x="565.0" y="340" text-anchor="middle" font-size="11.5" fill="#1b2430">agents_data: files,</text><text x="565.0" y="356" text-anchor="middle" font-size="11.5" fill="#1b2430">run records</text><rect x="660" y="298" width="150" height="64" rx="9" fill="#fbe3b0" stroke="#c58a14" stroke-width="1.6"/><text x="735.0" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Runner :3100</text><text x="735.0" y="340" text-anchor="middle" font-size="11.5" fill="#1b2430">127.0.0.1, HARNESS_RUNS=1</text><rect x="870" y="60" width="150" height="86" rx="9" fill="#c8ecec" stroke="#2f9aa0" stroke-width="1.6"/><text x="945.0" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Neon Postgres</text><text x="945.0" y="102" text-anchor="middle" font-size="11.5" fill="#1b2430">users, sessions, chats,</text><text x="945.0" y="118" text-anchor="middle" font-size="11.5" fill="#1b2430">credit, credentials</text><rect x="870" y="170" width="150" height="76" rx="9" fill="#c8ecec" stroke="#2f9aa0" stroke-width="1.6"/><text x="945.0" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Neon Auth</text><text x="945.0" y="212" text-anchor="middle" font-size="11.5" fill="#1b2430">Google / GitHub</text><text x="945.0" y="228" text-anchor="middle" font-size="11.5" fill="#1b2430">sign-in</text><rect x="870" y="270" width="150" height="76" rx="9" fill="#f9d2d6" stroke="#c9505e" stroke-width="1.6"/><text x="945.0" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">OpenRouter</text><text x="945.0" y="312" text-anchor="middle" font-size="11.5" fill="#1b2430">models, per-user keys,</text><text x="945.0" y="328" text-anchor="middle" font-size="11.5" fill="#1b2430">Management API</text><rect x="870" y="370" width="150" height="76" rx="9" fill="#f9d2d6" stroke="#c9505e" stroke-width="1.6"/><text x="945.0" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">E2B / Fly Sprites</text><text x="945.0" y="412" text-anchor="middle" font-size="11.5" fill="#1b2430">cloud sandboxes</text><text x="945.0" y="428" text-anchor="middle" font-size="11.5" fill="#1b2430">for runs</text><rect x="470" y="450" width="360" height="66" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="650.0" y="472" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">GitHub</text><text x="650.0" y="492" text-anchor="middle" font-size="11.5" fill="#1b2430">clone + push runs, issues and PRs for linked chats</text><path d="M210 98 L260 130" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="211.25" y="90" width="47.5" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="235" y="104" text-anchor="middle" font-size="11" fill="#1b2430">HTTPS</text><path d="M210 208 L260 170" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><path d="M430 150 L490 160" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="436.25" y="130" width="47.5" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="460" y="144" text-anchor="middle" font-size="11" fill="#1b2430">:3000</text><path d="M810 145 L870 110" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="824.55" y="102" width="34.9" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="842" y="116" text-anchor="middle" font-size="11" fill="#1b2430">SQL</text><path d="M810 165 L870 205" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="811.95" y="188" width="60.1" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="842" y="202" text-anchor="middle" font-size="11" fill="#1b2430">/auth/*</text><path d="M810 185 L870 300" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="826.25" y="252" width="47.5" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="850" y="266" text-anchor="middle" font-size="11" fill="#1b2430">proxy</text><path d="M810 340 L870 398" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="813.1" y="376" width="53.8" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="840" y="390" text-anchor="middle" font-size="11" fill="#1b2430">driver</text><path d="M735 362 L735 450" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="717.55" y="410" width="34.9" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="735" y="424" text-anchor="middle" font-size="11" fill="#1b2430">git</text><path d="M570 194 L570 214" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><text x="20" y="560" text-anchor="start" font-size="12" fill="#8793a3">Gateway and Router reach OpenRouter through the Interceptor /openrouter-proxy, so keys can rotate without a restart.</text><text x="20" y="582" text-anchor="start" font-size="12" fill="#8793a3">With no DATABASE_URL the same image keeps users and chats in files and browser storage.</text></svg>
