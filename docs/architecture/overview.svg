<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">System overview</title><desc id="d">Clients talk to the Interceptor on port 3000, which asks the Router, forwards to the Gateway, and proxies the task runner.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8793a3"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8793a3"/></marker></defs><rect x="20" y="60" width="200" height="86" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="120.0" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Claude Code, Cursor, Aider</text><text x="120.0" y="102" text-anchor="middle" font-size="11.5" fill="#1b2430">POST /v1/messages</text><text x="120.0" y="118" text-anchor="middle" font-size="11.5" fill="#1b2430">POST /v1/chat/completions</text><rect x="20" y="176" width="200" height="86" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="120.0" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Bright Chat + web UI</text><text x="120.0" y="218" text-anchor="middle" font-size="11.5" fill="#1b2430">ui/*.html in the browser</text><text x="120.0" y="234" text-anchor="middle" font-size="11.5" fill="#1b2430">chat, dashboard, routing, runs</text><rect x="20" y="292" width="200" height="86" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="120.0" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Scripts and hooks</text><text x="120.0" y="334" text-anchor="middle" font-size="11.5" fill="#1b2430">guard hook, ask_jev_file MCP</text><text x="120.0" y="350" text-anchor="middle" font-size="11.5" fill="#1b2430">POST /v1/guard, /v1/jev/ask</text><rect x="270" y="30" width="520" height="430" rx="14" fill="none" stroke="#8793a3" stroke-width="1.5" stroke-dasharray="8 5"/><rect x="286.0" y="20" width="268.0" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="420.0" y="34" text-anchor="middle" font-size="11" font-weight="700" fill="#1b2430">one machine (npm run all, Docker or Fly)</text><rect x="300" y="160" width="200" height="120" rx="9" fill="#cfe3ff" stroke="#4a86d8" stroke-width="1.6"/><text x="400.0" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Interceptor :3000</text><text x="400.0" y="202" text-anchor="middle" font-size="11.5" fill="#1b2430">server.js (Node, Express)</text><text x="400.0" y="218" text-anchor="middle" font-size="11.5" fill="#1b2430">login, transforms, routing,</text><text x="400.0" y="234" text-anchor="middle" font-size="11.5" fill="#1b2430">usage log, serves ui/</text><rect x="560" y="60" width="200" height="76" rx="9" fill="#e1d6f8" stroke="#7a5cc4" stroke-width="1.6"/><text x="660.0" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Router :6060</text><text x="660.0" y="102" text-anchor="middle" font-size="11.5" fill="#1b2430">router.py (Python)</text><text x="660.0" y="118" text-anchor="middle" font-size="11.5" fill="#1b2430">Jev / Laya / RouteLLM</text><rect x="560" y="200" width="200" height="76" rx="9" fill="#cdeed6" stroke="#3f9f5f" stroke-width="1.6"/><text x="660.0" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Gateway :4000</text><text x="660.0" y="242" text-anchor="middle" font-size="11.5" fill="#1b2430">LiteLLM, config.yaml</text><text x="660.0" y="258" text-anchor="middle" font-size="11.5" fill="#1b2430">model list + fallbacks</text><rect x="560" y="340" width="200" height="76" rx="9" fill="#fbe3b0" stroke="#c58a14" stroke-width="1.6"/><text x="660.0" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Task runner :3100</text><text x="660.0" y="382" text-anchor="middle" font-size="11.5" fill="#1b2430">runner/server.js</text><text x="660.0" y="398" text-anchor="middle" font-size="11.5" fill="#1b2430">agents, swarm, sandboxes</text><rect x="300" y="340" width="200" height="76" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="400.0" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Local files</text><text x="400.0" y="382" text-anchor="middle" font-size="11.5" fill="#1b2430">harness-settings.json</text><text x="400.0" y="398" text-anchor="middle" font-size="11.5" fill="#1b2430">routing-profiles.json, runs/</text><rect x="840" y="150" width="180" height="96" rx="9" fill="#f9d2d6" stroke="#c9505e" stroke-width="1.6"/><text x="930.0" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Model providers</text><text x="930.0" y="192" text-anchor="middle" font-size="11.5" fill="#1b2430">OpenRouter, Groq,</text><text x="930.0" y="208" text-anchor="middle" font-size="11.5" fill="#1b2430">local engine :8000,</text><text x="930.0" y="224" text-anchor="middle" font-size="11.5" fill="#1b2430">Ollama (opt-in)</text><rect x="840" y="340" width="180" height="76" rx="9" fill="#f9d2d6" stroke="#c9505e" stroke-width="1.6"/><text x="930.0" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Cloud sandboxes</text><text x="930.0" y="382" text-anchor="middle" font-size="11.5" fill="#1b2430">E2B, Fly Sprites,</text><text x="930.0" y="398" text-anchor="middle" font-size="11.5" fill="#1b2430">local git worktree</text><rect x="300" y="510" width="200" height="70" rx="9" fill="#c8ecec" stroke="#2f9aa0" stroke-width="1.6" stroke-dasharray="6 4"/><text x="400.0" y="532" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Postgres (Neon)</text><text x="400.0" y="552" text-anchor="middle" font-size="11.5" fill="#1b2430">optional: chats, users,</text><text x="400.0" y="568" text-anchor="middle" font-size="11.5" fill="#1b2430">sessions, credit</text><path d="M220 103 L300 200" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="197.9" y="130" width="104.2" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="250" y="144" text-anchor="middle" font-size="11" fill="#1b2430">client request</text><path d="M220 219 L300 219" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="216.2" y="209" width="91.6" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="262" y="223" text-anchor="middle" font-size="11" fill="#1b2430">/ui, /ui/api</text><path d="M220 335 L300 250" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><path d="M500 200 L560 100" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="487.35" y="130" width="85.3" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="530" y="144" text-anchor="middle" font-size="11" fill="#1b2430">POST /route</text><path d="M500 240 L560 238" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="493.65" y="212" width="72.69999999999999" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="530" y="226" text-anchor="middle" font-size="11" fill="#1b2430">toGateway</text><path d="M760 238 L840 198" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><path d="M400 280 L400 340" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><path d="M500 260 L560 360" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)" marker-start="url(#as)"/><rect x="494.2" y="310" width="91.6" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="540" y="324" text-anchor="middle" font-size="11" fill="#1b2430">/ui/api/runs</text><path d="M760 378 L840 378" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><path d="M400 416 L400 510" fill="none" stroke="#8793a3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="354.2" y="452" width="91.6" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="400" y="466" text-anchor="middle" font-size="11" fill="#1b2430">DATABASE_URL</text><path d="M560 380 L500 380" fill="none" stroke="#8793a3" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/></svg>
