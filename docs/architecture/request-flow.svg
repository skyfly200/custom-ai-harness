<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 740" width="1040" height="740" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-labelledby="t d"><title id="t">Request flow</title><desc id="d">Step by step path of one model request through the Interceptor, Router and Gateway.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8793a3"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8793a3"/></marker></defs><rect x="40" y="20" width="700" height="72" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="60" y="46" text-anchor="start" font-size="15" font-weight="700" fill="#1b2430">1  Access</text><text x="60" y="66" text-anchor="start" font-size="12.5" fill="#1b2430">express middleware in server.js</text><text x="60" y="83" text-anchor="start" font-size="11.5" fill="#1b2430">idle timer, run keys, runner/internal auth, then login or HARNESS_PASSWORD</text><path d="M390 92 L390 110" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="110" width="700" height="72" rx="9" fill="#e1d6f8" stroke="#7a5cc4" stroke-width="1.6"/><text x="60" y="136" text-anchor="start" font-size="15" font-weight="700" fill="#1b2430">2  Strategy</text><text x="60" y="156" text-anchor="start" font-size="12.5" fill="#1b2430">profileOf: x-harness-profile / strategy</text><text x="60" y="173" text-anchor="start" font-size="11.5" fill="#1b2430">named routing; &quot;auto&quot; picks one by rules, then Jev (utils/autoStrategy.js)</text><path d="M390 182 L390 200" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="200" width="700" height="72" rx="9" fill="#cfe3ff" stroke="#4a86d8" stroke-width="1.6"/><text x="60" y="226" text-anchor="start" font-size="15" font-weight="700" fill="#1b2430">3  Transforms</text><text x="60" y="246" text-anchor="start" font-size="12.5" fill="#1b2430">utils/messageTransforms.js</text><text x="60" y="263" text-anchor="start" font-size="11.5" fill="#1b2430">Caveman prompt, context anchor, Headroom; cap max_tokens; drop unsigned thinking</text><path d="M390 272 L390 290" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="290" width="700" height="72" rx="9" fill="#e1d6f8" stroke="#7a5cc4" stroke-width="1.6"/><text x="60" y="316" text-anchor="start" font-size="15" font-weight="700" fill="#1b2430">4  Route</text><text x="60" y="336" text-anchor="start" font-size="12.5" fill="#1b2430">routeModel: pin / x-harness-model / images / Jev questions</text><text x="60" y="353" text-anchor="start" font-size="11.5" fill="#1b2430">else POST /route -&gt; win rate vs threshold; effort + max-tier move the tier (utils/tiers.js)</text><path d="M390 362 L390 380" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="380" width="700" height="72" rx="9" fill="#fbe3b0" stroke="#c58a14" stroke-width="1.6"/><text x="60" y="406" text-anchor="start" font-size="15" font-weight="700" fill="#1b2430">5  Charge</text><text x="60" y="426" text-anchor="start" font-size="12.5" fill="#1b2430">chargeGate: guestGate or ownKeyGate</text><text x="60" y="443" text-anchor="start" font-size="11.5" fill="#1b2430">guest: reserve worst case on the capped credit; member: own OpenRouter key ticket</text><path d="M390 452 L390 470" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="470" width="700" height="72" rx="9" fill="#cfe3ff" stroke="#4a86d8" stroke-width="1.6"/><text x="60" y="496" text-anchor="start" font-size="15" font-weight="700" fill="#1b2430">6  Cache markers</text><text x="60" y="516" text-anchor="start" font-size="12.5" fill="#1b2430">utils/cacheMarkers.js</text><text x="60" y="533" text-anchor="start" font-size="11.5" fill="#1b2430">x-harness-cache + Claude model: add cache_control to messages</text><path d="M390 542 L390 560" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="560" width="700" height="72" rx="9" fill="#cdeed6" stroke="#3f9f5f" stroke-width="1.6"/><text x="60" y="586" text-anchor="start" font-size="15" font-weight="700" fill="#1b2430">7  Gateway</text><text x="60" y="606" text-anchor="start" font-size="12.5" fill="#1b2430">toGateway proxy (utils/gatewayGuard.js)</text><text x="60" y="623" text-anchor="start" font-size="11.5" fill="#1b2430">LiteLLM calls the provider; request fallbacks on failure; 502/504/idle timeouts</text><path d="M390 632 L390 650" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="650" width="700" height="72" rx="9" fill="#f9d2d6" stroke="#c9505e" stroke-width="1.6"/><text x="60" y="676" text-anchor="start" font-size="15" font-weight="700" fill="#1b2430">8  Reply</text><text x="60" y="696" text-anchor="start" font-size="12.5" fill="#1b2430">stream back to the client</text><text x="60" y="713" text-anchor="start" font-size="11.5" fill="#1b2430">x-harness-event/model/route headers; routing log, usage, cost, Langfuse</text><rect x="790" y="20" width="230" height="72" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="905.0" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Client</text><text x="905.0" y="62" text-anchor="middle" font-size="11.5" fill="#1b2430">Claude Code, Cursor,</text><text x="905.0" y="78" text-anchor="middle" font-size="11.5" fill="#1b2430">Bright Chat, runner</text><rect x="790" y="290" width="230" height="72" rx="9" fill="#e1d6f8" stroke="#7a5cc4" stroke-width="1.6"/><text x="905.0" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Router :6060</text><text x="905.0" y="332" text-anchor="middle" font-size="11.5" fill="#1b2430">POST /route, /ask</text><text x="905.0" y="348" text-anchor="middle" font-size="11.5" fill="#1b2430">BERT or Jev classifier</text><rect x="790" y="560" width="230" height="72" rx="9" fill="#cdeed6" stroke="#3f9f5f" stroke-width="1.6"/><text x="905.0" y="582" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Gateway :4000</text><text x="905.0" y="602" text-anchor="middle" font-size="11.5" fill="#1b2430">LiteLLM -&gt; OpenRouter,</text><text x="905.0" y="618" text-anchor="middle" font-size="11.5" fill="#1b2430">Groq, local engine</text><rect x="790" y="650" width="230" height="72" rx="9" fill="#dfe3e8" stroke="#7d8794" stroke-width="1.6"/><text x="905.0" y="672" text-anchor="middle" font-size="14" font-weight="700" fill="#1b2430">Client (reply)</text><text x="905.0" y="692" text-anchor="middle" font-size="11.5" fill="#1b2430">streamed back as it arrives</text><path d="M740 56 L790 56" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="734.95" y="30" width="60.1" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="765" y="44" text-anchor="middle" font-size="11" fill="#1b2430">request</text><path d="M740 326 L790 326" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)" marker-start="url(#as)"/><rect x="731.8" y="300" width="66.4" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="765" y="314" text-anchor="middle" font-size="11" fill="#1b2430">win rate</text><path d="M740 596 L790 596" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="744.4" y="570" width="41.2" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="765" y="584" text-anchor="middle" font-size="11" fill="#1b2430">call</text><path d="M740 686 L790 686" fill="none" stroke="#8793a3" stroke-width="2" marker-end="url(#a)"/><rect x="741.25" y="660" width="47.5" height="20" rx="10" fill="#eef1f5" stroke="#8793a3" stroke-width="1"/><text x="765" y="674" text-anchor="middle" font-size="11" fill="#1b2430">reply</text></svg>
