# Fly.io config. Steps are in docs/fly.md. Change `app` to a name nobody else has taken.
app = "skyler-agents"
primary_region = "dfw"   # Dallas: Fly has no Denver region

[build]
  dockerfile = "Dockerfile.fly"

[env]
  HARNESS_SERVER = "1"
  HARNESS_REQUIRE_LOGIN = "1"
  HARNESS_PUBLIC_URL = "https://ai.skylerfly.com"
  HARNESS_DATA_DIR = "/app/data"
  HARNESS_IDLE_STOP_MIN = "30"   # sleep after 30 idle minutes; the Stop button on the Dashboard does it now
  # secrets (DATABASE_URL, NEON_AUTH_BASE_URL, HARNESS_ADMINS, HARNESS_ADMIN_EMAILS,
  # LITELLM_MASTER_KEY, OPENROUTER_API_KEY, OAUTH_PROVIDERS="google,github" once GitHub sign-in is set up in Neon...) are set with `fly secrets set`, never here

[mounts]
  source = "agents_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true      # opening the address (or a Claude Code call) wakes a stopped Machine
  auto_stop_machines = "off"      # the app stops itself (HARNESS_IDLE_STOP_MIN), so Fly's own idle stop stays off
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"        # LiteLLM takes a while to start

# exiting 0 (the app stopping on purpose) leaves the Machine stopped; a crash (non-zero) restarts it
[[restart]]
  policy = "on-failure"
  retries = 5

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
