# Fly.io config. Steps are in docs/fly.md. Change `app` to a name nobody else has taken.
app = "skyler-agents"
primary_region = "den"   # Denver; check `fly platform regions`, use "dfw" (Dallas) if it isn't listed

[build]
  dockerfile = "Dockerfile.fly"

[env]
  HARNESS_SERVER = "1"
  HARNESS_REQUIRE_LOGIN = "1"
  HARNESS_PUBLIC_URL = "https://agents.skylerfly.com"
  HARNESS_DATA_DIR = "/app/data"
  OAUTH_PROVIDERS = "google"
  # secrets (DATABASE_URL, NEON_AUTH_BASE_URL, HARNESS_ADMINS, HARNESS_ADMIN_EMAILS,
  # LITELLM_MASTER_KEY, OPENROUTER_API_KEY...) are set with `fly secrets set`, never here

[mounts]
  source = "agents_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true      # opening the address (or a Claude Code call) wakes a stopped Machine
  auto_stop_machines = "off"      # sleeping after 30 idle minutes comes with the Stop button (next PR); until then: fly machine stop
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"        # LiteLLM takes a while to start

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
