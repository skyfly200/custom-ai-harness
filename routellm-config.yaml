# Router (router.py) — local RouteLLM BERT classifier, no external embedding API needed
checkpoint: routellm/bert_gpt4_augmented

# Gateway (config.yaml) model names the Router picks between.
# The Interceptor sends the request to the Gateway, which applies the fallback chain.
strong_model: or-deepseek-v4.1-flash-1017
# Hard requests that carry tools (Claude Code, agents) can go to their own
# model; unset sends them to strong_model. fallback-openrouter-tools is free
# (NVIDIA Nemotron 3.5 Super VL) and calls tools.
# strong_model_tools: fallback-openrouter-tools
weak_model: or-deepseek-v4.1-flash-1017

# Groq's free tier allows 8K tokens per minute, counting requested output.
# Weak requests estimated above this go to the overflow model instead
# (every Claude Code request does: its system prompt and tools alone exceed it).
# weak_model_max_tokens: 7000
# weak_model_overflow: or-deepseek-v4.1-flash-1017

# Weak requests that carry tools (every Claude Code request) need a model that
# makes tool calls; the size cap above doesn't apply to it.
# weak_model_tools: or-deepseek-v4.1-flash-1017

# Classifier backend: routellm (default) | laya | systemone | llm | custom.
# Each returns the strong model's win rate; the rest of the Router is unchanged.

# Active: TypeSafe's Jev through OpenRouter, with the OPENROUTER_API_KEY from .env.
# If Jev errors or times out, the Interceptor sends the request to fallback-openrouter.
backend: systemone
base_url: https://openrouter.ai/api      # the Router appends /v1/systemone
api_key_env: OPENROUTER_API_KEY
model: jev-latest                        # or pin a version, e.g. jev-1.13
max_chars: 2000          # tail of the prompt sent
timeout: 5               # under the Interceptor's 10 s wait on the Router

# -- Laya on your own machine instead (./launch-laya.sh, same protocol, no key on localhost)
# base_url: http://127.0.0.1:8001
# and drop api_key_env and model

# -- routellm: the BERT checkpoint above, in-process
# backend: routellm

# -- laya: in-process (pip install -r requirements-laya.txt; weights come from Hugging Face)
# backend: laya
# laya_max_chars: 2000   # tail of the prompt sent to laya (encoder context is 512-1024 tokens)
# laya_preload: false

# -- systemone: TypeSafe Jev, or a running `laya-serve`, via POST /v1/systemone
# backend: systemone
# base_url: https://openrouter.ai/api            # Jev via OpenRouter, https://api.typesafe.ai direct, or http://localhost:8001 for launch-laya.sh
# api_key_env: OPENROUTER_API_KEY               # name of the env var holding the key (optional)
# auth_header: Authorization                    # header that gets "Bearer <key>"
# model: jev-latest                             # optional

# -- llm: any OpenAI-compatible reasoning model rates difficulty 0-1
# backend: llm
# base_url: https://openrouter.ai/api/v1
# model: deepseek/deepseek-r1
# api_key_env: OPENROUTER_API_KEY

# -- custom: your own scorer, factory(config) -> callable(prompt) -> float in [0, 1]
# backend: custom
# scorer: my_scorer:make
# strong_model_tools: or-deepseek-v4.1-flash-1017
