# Router (router.py) — local RouteLLM BERT classifier, no external embedding API needed
checkpoint: routellm/bert_gpt4_augmented

# Gateway (config.yaml) model names the Router picks between.
# The Interceptor sends the request to the Gateway, which applies the fallback chain.
strong_model: claude-sonnet-5
weak_model: fallback-groq

# Groq's free tier allows 8K tokens per minute, counting requested output.
# Weak requests estimated above this go to the overflow model instead
# (every Claude Code request does: its system prompt and tools alone exceed it).
weak_model_max_tokens: 7000
weak_model_overflow: fallback-openrouter

# Classifier backend: routellm (default) | laya | systemone | llm | custom.
# Each returns the strong model's win rate; the rest of the Router is unchanged.
# backend: routellm

# -- laya: in-process (pip install -r requirements-laya.txt; weights come from Hugging Face)
# backend: laya
# laya_max_chars: 2000   # tail of the prompt sent to laya (encoder context is 512-1024 tokens)
# laya_preload: false

# -- systemone: TypeSafe Jev, or a running `laya-serve`, via POST /v1/systemone
# backend: systemone
# base_url: https://api.example-jev-host.com    # or http://localhost:8000 for laya-serve
# api_key_env: JEV_API_KEY                      # name of the env var holding the key (optional)
# auth_header: Authorization                    # header that gets "Bearer <key>"
# model: jev-1                                  # optional

# -- llm: any OpenAI-compatible reasoning model rates difficulty 0-1
# backend: llm
# base_url: https://openrouter.ai/api/v1
# model: deepseek/deepseek-r1
# api_key_env: OPENROUTER_API_KEY

# -- custom: your own scorer, factory(config) -> callable(prompt) -> float in [0, 1]
# backend: custom
# scorer: my_scorer:make
