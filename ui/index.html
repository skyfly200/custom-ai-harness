<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Chat · Dashboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="bright.css">
</head>
<body>
<main>
  <header>
    <nav><h1 class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-name">Bright Chat</span><span class="brand-page">Dashboard</span></h1><a href="./" class="here" data-hint="Health of each part, recent chats, usage and requests">Dashboard</a><a href="chat.html" data-hint="Talk to the models through the harness">Chat</a><a href="usage.html" data-hint="Tokens used, by client, model and service">Usage</a><a href="routing.html" data-hint="Where requests go, as connected boxes you can edit">Routing</a><a href="settings.html" data-hint="Interceptor and Router settings">Settings</a></nav>
    <span class="muted" id="updated" data-hint="This page refreshes itself every few seconds">Loading…</span>
  </header>

  <h2 data-hint="Each part of the harness and whether it answers. Optional parts can be off">Components</h2>
  <div class="grid" id="components"></div>

  <h2 data-hint="Counts reset when the Interceptor (npm start) restarts">Since the Interceptor started</h2>
  <div class="grid" id="stats"></div>

  <div class="two home">
    <section>
      <h2 data-hint="Your latest chats on this browser, newest first"><a href="chat.html">Recent chats</a></h2>
      <div class="card list" id="chats"><div class="sub muted">Loading…</div></div>
    </section>
    <section>
      <h2 data-hint="Totals from harness-usage.json for the last 7 days. The Usage page has the full breakdown"><a href="usage.html">Usage, last 7 days</a></h2>
      <div class="grid tiles" id="usageTiles"></div>
      <div class="card list" id="usageModels"></div>
    </section>
  </div>

  <h2 data-hint="The latest requests, newest first, with where they went and why">Recent routing decisions</h2>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>Time</th><th data-hint="The model the request was sent to">Model</th><th data-hint="Why that model: the Router's score against the threshold, a pin, the client's choice, or the Router being down">Why</th><th data-hint="The Gateway's answer: status, time, fallbacks tried, and the model that finally served it">Result</th><th data-hint="Input and output tokens the reply reported (~ means estimated)">Tokens</th><th>Request</th>
      </tr></thead>
      <tbody id="events"><tr><td colspan="6" class="muted">No requests yet.</td></tr></tbody>
    </table>
  </div>
</main>

<script src="hints.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
async function getJSON(url, opts) {
  const res = await fetch(url, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

// ---- status and events ---------------------------------------------------

const COMPONENT_HINTS = {
  'Router': 'Scores each request and picks a model (router.py, port 6060)',
  'Gateway (LiteLLM)': 'Sends each request to the provider and tries fallbacks when one fails (port 4000)',
  'Local engine': 'Optional local CLI wrapper serving models on port 8000',
  'Ollama': 'Optional: models running on this computer',
  'Laya (local)': 'Optional: a local Laya classifier server for the Router',
};
const STAT_HINTS = {
  'Requests': 'Requests that came through the Interceptor',
  'Router unreachable': 'Requests sent to the Router-down model because the Router didn’t answer',
  'Gateway fallbacks': 'Requests the Gateway had to send to a fallback model',
  'Errors': 'Requests that ended in an error',
  'Rate limited': 'Requests a provider refused for too many requests or a spent quota',
  'Timed out': 'Requests that took too long and were failed instead of hanging',
};

function renderComponents(components) {
  $('components').innerHTML = components.map(c => {
    const state = c.ok ? 'ok' : c.optional ? 'off' : 'bad';
    const label = c.ok ? `Up · ${c.ms} ms` : c.optional ? 'Not running (optional)' : `Down · ${esc(c.error || 'HTTP ' + c.status)}`;
    const extra = c.name === 'Router' && c.ok ? ` · classifier <b>${esc(c.detail?.backend)}</b>` : '';
    return `<div class="card"><div class="name" data-hint="${esc(COMPONENT_HINTS[c.name] || '')}"><span class="dot ${state}"></span>${esc(c.name)}</div>
      <div class="sub">${label}${extra}</div><div class="sub"><code>${esc(c.url)}</code></div></div>`;
  }).join('');
}

function renderStats(s) {
  const items = [['Requests', s.requests], ['Router unreachable', s.routerDown], ['Gateway fallbacks', s.fallbacks], ['Errors', s.errors], ['Rate limited', s.rateLimited ?? 0], ['Timed out', s.timeouts ?? 0]];
  $('stats').innerHTML = items.map(([k, v]) => `<div class="card stat" data-hint="${esc(STAT_HINTS[k] || '')}"><div class="num">${v}</div><div class="sub">${k}</div></div>`).join('')
    + `<div class="card stat"><div class="num" style="font-size:14px">${new Date(s.since).toLocaleString()}</div><div class="sub">Started</div></div>`;
}

function why(e) {
  if (e.reason) return `<span class="tag">${esc(e.reason)}</span>`;
  if (e.routerError) return `<span class="tag bad">Router down</span> fallback model <div class="sub">${esc(e.routerError)}</div>`;
  const strong = e.winRate != null && e.winRate >= e.threshold;
  return `win rate ${e.winRate ?? 'n/a'} ${strong ? '≥' : '<'} threshold ${e.threshold}` + (e.tools ? ' <span class="tag">tools</span>' : '');
}

function result(e) {
  if (e.errorKind === 'stopped') return `<span class="tag">stopped</span> <div class="sub">by the client</div>`;
  if (e.error) {
    const fail = `<span class="tag bad">${esc(e.errorKind || 'failed')}</span>` + (e.status ? ` ${e.status}` : '');
    const tried = e.fallbacks > 0 ? ` <span class="tag warn">${e.fallbacks} fallback${e.fallbacks > 1 ? 's' : ''}</span>` : '';
    return `${fail}${tried} <div class="sub">${esc(e.error)}</div>`;
  }
  if (e.status == null) return '<span class="muted">waiting…</span>';
  let out = `<span class="tag ${e.status >= 400 ? 'bad' : ''}">${e.status}</span> ${e.ms} ms`;
  if (e.fallbacks > 0) out += ` <span class="tag warn">${e.fallbacks} fallback${e.fallbacks > 1 ? 's' : ''}</span>`;
  if (e.servedBy && e.servedBy !== e.model) out += `<div class="sub">served by ${esc(e.servedBy)}</div>`;
  return out;
}

// Real counts once the reply has ended, else the Interceptor's size estimate
function tokens(e) {
  if (!e.usage) return e.tokens != null ? `<span class="muted" title="Estimated request size">~${e.tokens.toLocaleString()}</span>` : '';
  const approx = e.usage.estimated ? '~' : '';
  return `${approx}${e.usage.input.toLocaleString()} in<div class="sub">${approx}${e.usage.output.toLocaleString()} out</div>`;
}

function renderEvents(events) {
  if (!events.length) return;
  $('events').innerHTML = events.map(e => `<tr>
    <td class="num">${new Date(e.time).toLocaleTimeString()}</td>
    <td><code>${esc(e.model)}</code></td>
    <td>${why(e)}</td>
    <td>${result(e)}</td>
    <td class="num">${tokens(e)}</td>
    <td><div class="prompt" title="${esc(e.prompt)}">${esc(e.prompt) || '<span class="muted">(no typed text)</span>'}</div><div class="sub muted">${esc(e.path)}</div></td>
  </tr>`).join('');
}

// ---- recent chats ------------------------------------------------------------
// Chats live in this browser's localStorage (written by the chat page)

const readStore = (key, fallback) => { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } };

function ago(t) {
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  if (s < 7 * 86400) return `${Math.floor(s / 86400)} d ago`;
  return new Date(t).toLocaleDateString();
}

function renderChats() {
  const index = readStore('harness-chats', []);
  const projects = readStore('harness-projects', []);
  if (!Array.isArray(index) || !index.length) {
    $('chats').innerHTML = '<div class="sub muted">No chats yet on this browser.</div><a class="more" href="chat.html">Start a chat →</a>';
    return;
  }
  const rows = [...index].sort((a, b) => (b.updated || 0) - (a.updated || 0)).slice(0, 8).map(e => {
    const p = e.project && projects.find(x => x.id === e.project);
    const proj = p ? `<span class="proj"><i class="pdot" style="background:${esc(p.color)}"></i>${esc(p.name)}</span>` : '';
    return `<a class="row" href="chat.html#chat=${encodeURIComponent(e.id)}"><span class="title">${esc(e.title || 'New chat')}</span>${proj}<span class="meta">${e.count || 0} msg · ${ago(e.updated)}</span></a>`;
  });
  $('chats').innerHTML = rows.join('') + `<a class="more" href="chat.html">All ${index.length} chat${index.length === 1 ? '' : 's'} →</a>`;
}

// ---- usage summary -------------------------------------------------------------
// The same totals as the Usage page, priced from the Gateway's list

let prices = null;
const usd = (n) => n === 0 ? '$0' : n < 0.01 ? `$${n.toFixed(4)}` : n < 100 ? `$${n.toFixed(2)}` : `$${Math.round(n).toLocaleString()}`;
const short = (n) => n >= 1e9 ? `${(n / 1e9).toFixed(1)}B` : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e4 ? `${Math.round(n / 1e3)}k` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}k` : Math.round(n).toLocaleString();

function costOf(r) {
  const p = prices?.[r.servedBy];
  if (p?.free) return { cost: 0, free: true };
  if (!p || p.inputCost == null) return { cost: 0, unpriced: true };
  return { cost: r.input * p.inputCost + r.output * (p.outputCost || 0) };
}

async function loadUsage() {
  try {
    if (!prices) prices = (await getJSON('api/model-info').catch(() => ({}))).models || {};
    renderUsage(await getJSON('api/usage?days=7'));
  } catch (err) {
    $('usageTiles').innerHTML = '';
    $('usageModels').innerHTML = `<div class="sub muted">Usage unavailable: ${esc(err.message)}</div>`;
  }
}

function renderUsage({ rows = [] }) {
  const t = { requests: 0, input: 0, output: 0, cost: 0, unpriced: 0, free: 0 };
  const byModel = new Map();
  for (const r of rows) {
    const c = costOf(r);
    t.requests += r.requests; t.input += r.input; t.output += r.output; t.cost += c.cost;
    if (c.unpriced) t.unpriced += r.requests;
    if (c.free) t.free += r.requests;
    const m = byModel.get(r.servedBy) || { name: r.servedBy, provider: r.provider, requests: 0, tokens: 0, cost: 0 };
    m.requests += r.requests; m.tokens += r.input + r.output; m.cost += c.cost;
    byModel.set(r.servedBy, m);
  }
  const tile = (label, v, sub = '') => `<div class="card stat"><div class="num">${v}</div><div class="sub">${label}${sub ? ` · ${sub}` : ''}</div></div>`;
  $('usageTiles').innerHTML = [
    tile('Spend', usd(t.cost), t.unpriced ? `+${t.unpriced} unpriced` : ''),
    tile('Requests', t.requests.toLocaleString(), t.requests ? `${Math.round(100 * t.free / t.requests)}% free` : ''),
    tile('Tokens', short(t.input + t.output), `${short(t.input)} in · ${short(t.output)} out`),
  ].join('');
  if (!rows.length) { $('usageModels').innerHTML = '<div class="sub muted">No requests in the last 7 days.</div>'; return; }
  const top = [...byModel.values()].sort((a, b) => b.tokens - a.tokens);
  const max = top[0].tokens || 1;
  $('usageModels').innerHTML = top.slice(0, 5).map(m => `<div class="bar-row" title="${esc(m.provider)}">
      <span class="title"><code>${esc(m.name)}</code></span><span class="meta">${short(m.tokens)} tokens · ${m.requests} req${m.cost ? ` · ${usd(m.cost)}` : ''}</span>
      <span class="bar"><i style="width:${Math.max(2, 100 * m.tokens / max).toFixed(1)}%"></i></span></div>`).join('')
    + `<a class="more" href="usage.html">${top.length > 5 ? `${top.length - 5} more models · ` : ''}Full usage and costs →</a>`;
}

// ---- loop ------------------------------------------------------------------

async function refresh() {
  try {
    const [status, events] = await Promise.all([getJSON('api/status'), getJSON('api/events?limit=100')]);
    renderComponents(status.components);
    renderStats(status.stats);
    renderEvents(events);
    $('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    $('updated').textContent = `Interceptor unreachable: ${err.message}`;
  }
}

renderChats();
loadUsage();
refresh();
setInterval(refresh, 3000);
setInterval(loadUsage, 30000);
// Chats saved in another tab show up here as they change
addEventListener('storage', (e) => { if (e.key === 'harness-chats' || e.key === 'harness-projects') renderChats(); });
</script>
<script src="bright.js"></script>
</body>
</html>
